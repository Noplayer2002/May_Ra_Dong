<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Settings</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKi7eC8WD7fi_lu2Lm9FxUwMBIPd23bcw",
            authDomain: "may-ra-dong.firebaseapp.com",
            databaseURL: "https://may-ra-dong-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "may-ra-dong",
            storageBucket: "may-ra-dong.firebasestorage.app",
            messagingSenderId: "777662906578",
            appId: "1:777662906578:web:7b52d7ed61fb868b112d0b",

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

    <style media="screen">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f4; margin: 0; }
        .top-bar { background: #9ab474; color: white; padding: 15px 20px; font-size: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .nav { background: #e0e0e0; display: flex; border-bottom: 2px solid #9ab474; }
        .nav a { padding: 12px 20px; text-decoration: none; color: #555; font-weight: bold; border-right: 1px solid #ccc; transition: 0.3s; cursor: pointer; flex: 1; text-align: center; }
        .nav a:hover { background: #d5d5d5; }
        .nav a.active { background: #fff; color: #9ab474; border-top: 3px solid #9ab474; border-bottom: 2px solid #fff; margin-bottom: -2px; }
        .action-bar { padding: 12px 20px; display: flex; gap: 10px; justify-content: center; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 20px; }
        .page { display: none; }
        .page.active { display: block; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .search-box { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; outline: none; }
        .search-box:focus { border-color: #9ab474; box-shadow: 0 0 5px rgba(154, 180, 116, 0.5); }
        .list-container { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .device-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #fff; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .device-row:hover { background: #f1f8e9; }
        .device-row:last-child { border-bottom: none; }
        .device-name { font-weight: bold; font-size: 16px; color: #333; }
        
        .status-badge { display: flex; align-items: center; font-size: 13px; font-weight: bold; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .online-text { color: #4CAF50; }
        .offline-text { color: #f44336; }
        .dot.online { background-color: #4CAF50; box-shadow: 0 0 5px #4CAF50; }
        .dot.offline { background-color: #f44336; }

        .row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .row:last-child { border-bottom: none; }
        .label { width: 140px; font-weight: bold; color: #555; }
        .input-box { flex: 1; }
        input[type='text'], input[type='number'], input[type='password'] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
        .btn { display: block; width: 100%; margin-top: 15px; padding: 12px; background: #4CAF50; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-orange { background: #ff9800; }
        .btn-secondary { background: #757575; padding: 8px 12px; font-size: 14px; width: auto; margin: 0; }
        
        .info-item { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .info-label { font-weight: bold; color: #555; }
        .info-value { color: #333; font-weight: bold; }

        @media (max-width: 600px) {
            .container { margin: 10px; padding: 15px; }
            .nav { flex-direction: column; }
            .row { flex-direction: column; align-items: flex-start; }
            .label { width: 100%; margin-bottom: 5px; }
            .input-box { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="device-selection-page" class="page active">
        <div class="top-bar">⚙️ Quản lý thiết bị</div>
        <div class="container">
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Tìm kiếm thiết bị..." onkeyup="filterDevices()">
            <div id="devices-list" class="list-container"></div>
            <div class="action-bar" style="padding: 15px 0 0 0;">
                <button class="btn btn-orange" id="btn-check-device-status" onclick="broadcastPing()">⚡ Quét Trạng Thái (Global Ping)</button>
            </div>
        </div>
    </div>

    <div id="settings-page" class="page">
        <div class="top-bar">
            <span>⚙️ <span id="selected-device-name">ESP32</span></span>
            <button class="btn-secondary" onclick="showPage('device-selection-page')">← Trở lại</button>
        </div>
        <div class="nav">
            <a class="active" onclick="switchTab(event, 'wifi')">Wi-Fi</a>
            <a onclick="switchTab(event, 'tcp')">TCP</a>
            <a onclick="switchTab(event, 'config')">Thông tin</a>
        </div>
        <div class="container">
            <div id="wifi" class="tab-content active">
                <form id="wifi-connect-form">
                    <div class="row"><div class="label">SSID</div><div class="input-box"><input type="text" id="ssid" required></div></div>
                    <div class="row"><div class="label">Mật khẩu</div><div class="input-box"><input type="password" id="wifi-pass"></div></div>
                    <button type="submit" class="btn">💾 Lưu Wi-Fi</button>
                </form>
            </div>
            <div id="tcp" class="tab-content">
                <form id="tcp-form">
                    <div class="row"><div class="label">Server IP</div><div class="input-box"><input type="text" id="server_ip" required></div></div>
                    <div class="row"><div class="label">Server Port</div><div class="input-box"><input type="number" id="server_port" required></div></div>
                    <button type="submit" class="btn">💾 Lưu TCP</button>
                </form>
            </div>
            <div id="config" class="tab-content">
                <div class="info-item"><span class="info-label">📡 Trạng thái:</span><span class="info-value" id="network-status">...</span></div>
                <div class="info-item"><span class="info-label">🌐 IP:</span><span class="info-value" id="ip-address">N/A</span></div>
                <div class="info-item"><span class="info-label">🔗 MAC:</span><span class="info-value" id="mac-address">N/A</span></div>
            </div>
        </div>
    </div>

    <script>
        let devicesDataCache = {};
        let selectedDeviceId = null;

        function showPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageName).classList.add('active');
            if(pageName === 'device-selection-page') selectedDeviceId = null;
        }

        function renderDevicesList() {
            const list = document.getElementById('devices-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            if (!devicesDataCache || Object.keys(devicesDataCache).length === 0) {
                list.innerHTML = '<p style="text-align:center; padding:20px; color:#999;">Trống</p>'; return;
            }
            let html = '';
            Object.keys(devicesDataCache).forEach(id => {
                if (id.toLowerCase().includes(search)) {
                    const status = (devicesDataCache[id].info && devicesDataCache[id].info.status === 'online');
                    html += `
                        <div class="device-row" onclick="selectDevice('${id}')">
                            <div class="device-name">${id}</div>
                            <div class="status-badge ${status ? 'online-text' : 'offline-text'}">
                                <div class="dot ${status ? 'online' : 'offline'}"></div> ${status ? 'Online' : 'Offline'}
                            </div>
                        </div>`;
                }
            });
            list.innerHTML = html || '<p style="text-align:center; padding:20px; color:#999;">Không tìm thấy</p>';
        }

        function filterDevices() { renderDevicesList(); }

        function selectDevice(id) {
            selectedDeviceId = id;
            document.getElementById('selected-device-name').textContent = id;
            updateUI(devicesDataCache[id]);
            showPage('settings-page');
        }

        function switchTab(e, tab) {
            document.querySelectorAll('.tab-content, .nav a').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            e.target.classList.add('active');
        }

        function updateUI(device) {
            if (!device) return;
            const info = device.info || {}, tcp = device.tcp || {};
            const isOnline = (info.status === 'online');
            const stEl = document.getElementById('network-status');
            
            stEl.textContent = isOnline ? '🟢 Online' : '🔴 Offline';
            stEl.style.color = isOnline ? '#4CAF50' : '#f44336';
            document.getElementById('ip-address').textContent = info.ip || 'N/A';
            document.getElementById('mac-address').textContent = info.mac || 'N/A';
            document.getElementById('ssid').value = (info.wifi && info.wifi.ssid) || info.ssid || '';
            document.getElementById('wifi-pass').value = (info.wifi && info.wifi.pass) || '';
            document.getElementById('server_ip').value = tcp.server_ip || '';
            document.getElementById('server_port').value = tcp.server_port || '';
        }

        // ==========================================
        // THUẬT TOÁN GLOBAL PING (BROADCAST) MỚI
        // ==========================================
        function broadcastPing() {
            const btn = document.getElementById('btn-check-device-status');
            btn.disabled = true;
            btn.textContent = "⏳ Đang phát sóng...";

            const currentPing = Date.now();

            // 1. Ghi đúng 1 lệnh duy nhất ra thư mục gốc
            db.ref('esp32/global_command/ping').set(currentPing);

            // 2. Đợi 3 giây để các ESP32 tự cập nhật 'pong' của chúng
            setTimeout(() => {
                const updates = {};
                
                // 3. Quét qua Cache cục bộ trên trình duyệt (đã được on('value') update ngầm)
                Object.keys(devicesDataCache).forEach(deviceId => {
                    const device = devicesDataCache[deviceId];
                    const pongValue = (device.info && device.info.pong) ? device.info.pong : 0;
                    
                    // So sánh: Nếu ESP32 nào có pong trùng khớp -> Nó đang sống
                    if (pongValue === currentPing) {
                        updates[`${deviceId}/info/status`] = 'online';
                    } else {
                        updates[`${deviceId}/info/status`] = 'offline';
                    }
                });

                // 4. Batch Update - Gửi cập nhật trạng thái của CẢ 20 THIẾT BỊ trong đúng 1 lệnh Ghi
                if (Object.keys(updates).length > 0) {
                    db.ref('esp32/devices').update(updates).then(() => {
                        btn.disabled = false;
                        btn.textContent = "⚡ Quét Trạng Thái (Global Ping)";
                    });
                } else {
                    btn.disabled = false;
                    btn.textContent = "⚡ Quét Trạng Thái (Global Ping)";
                }

            }, 3000); // Thời gian chờ (có thể chỉnh xuống 2000ms nếu mạng mượt)
        }

        // ==========================================
        // LẮNG NGHE DATA REALTIME TỪ FIREBASE
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            db.ref('esp32/devices').on('value', (snap) => {
                devicesDataCache = snap.val() || {};
                if(document.getElementById('device-selection-page').classList.contains('active')) renderDevicesList();
                if(selectedDeviceId && devicesDataCache[selectedDeviceId]) updateUI(devicesDataCache[selectedDeviceId]);
            });

            document.getElementById('wifi-connect-form').onsubmit = (e) => {
                e.preventDefault();
                db.ref(`esp32/devices/${selectedDeviceId}/info/wifi`).set({
                    ssid: document.getElementById('ssid').value,
                    pass: document.getElementById('wifi-pass').value
                }).then(() => alert("✅ Đã lưu!"));
            };

            document.getElementById('tcp-form').onsubmit = (e) => {
                e.preventDefault();
                db.ref(`esp32/devices/${selectedDeviceId}/tcp`).set({
                    server_ip: document.getElementById('server_ip').value,
                    server_port: parseInt(document.getElementById('server_port').value)
                }).then(() => alert("✅ Đã lưu!"));
            };
        });
    </script>
</body>
</html>

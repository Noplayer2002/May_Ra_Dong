<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Settings</title>

    <!-- 1. GỌI FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <!-- 2. CẤU HÌNH FIREBASE -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDKi7eC8WD7fi_lu2Lm9FxUwMBIPd23bcw",
            authDomain: "may-ra-dong.firebaseapp.com",
            databaseURL: "https://may-ra-dong-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "may-ra-dong",
            storageBucket: "may-ra-dong.firebasestorage.app",
            messagingSenderId: "777662906578",
            appId: "1:777662906578:web:7b52d7ed61fb868b112d0b",
            measurementId: "G-F61WGFMGQ6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <!-- 3. CSS GIAO DIỆN -->
    <style media="screen">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f4; margin: 0; }
        .top-bar { background: #9ab474; color: white; padding: 15px 20px; font-size: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav { background: #e0e0e0; display: flex; border-bottom: 2px solid #9ab474; }
        .nav a { padding: 12px 20px; text-decoration: none; color: #555; font-weight: bold; border-right: 1px solid #ccc; transition: 0.3s; cursor: pointer; flex: 1; text-align: center; }
        .nav a:hover { background: #d5d5d5; }
        .nav a.active { background: #fff; color: #9ab474; border-top: 3px solid #9ab474; border-bottom: 2px solid #fff; margin-bottom: -2px; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        h2 { color: #555; margin-top: 0; margin-bottom: 20px; }
        .row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .row:last-child { border-bottom: none; }
        .label { width: 140px; font-weight: bold; color: #555; }
        .input-box { flex: 1; }
        input[type='text'], input[type='number'], input[type='password'], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #9ab474; box-shadow: 0 0 5px rgba(154, 180, 116, 0.3); }
        .btn { display: block; width: 100%; margin-top: 15px; padding: 12px; background: #4CAF50; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #45a049; }
        .btn-blue { background: #2196F3; }
        .btn-blue:hover { background: #0b7dda; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
        .info-item { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .info-item:last-child { border-bottom: none; }
        .info-label { font-weight: bold; color: #555; }
        .info-value { color: #333; font-family: 'Courier New', monospace; word-break: break-all; }
        .status-connected { color: #4CAF50; font-weight: bold; }
        .status-disconnected { color: #f44336; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        @media (max-width: 600px) {
            .container { margin: 10px; padding: 15px; }
            .nav { flex-direction: column; }
            .nav a { border-right: none; border-bottom: 1px solid #ccc; }
            .row { flex-direction: column; align-items: flex-start; }
            .label { width: 100%; margin-bottom: 5px; }
            .input-box { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="top-bar">⚙️ ESP32 Settings</div>
    
    <div class="nav">
        <a class="active" onclick="switchTab(event, 'wifi')">Wi-Fi</a>
        <a onclick="switchTab(event, 'tcp')">TCP Client</a>
        <a onclick="switchTab(event, 'config')">Config</a>
    </div>

    <div class="container">
        <!-- TAB 1: WI-FI SETTINGS -->
        <div id="wifi" class="tab-content active">
            <h2>Kết nối mạng Wi-Fi</h2>
            <form id="wifi-connect-form">
                <div class="form-group">
                    <div class="row">
                        <div class="label">SSID</div>
                        <div class="input-box">
                            <input type="text" id="ssid" name="ssid" placeholder="Tên mạng Wi-Fi" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="row">
                        <div class="label">Password</div>
                        <div class="input-box">
                            <input type="password" name="pass" placeholder="Mật khẩu">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn">💾 Lưu cài đặt Wi-Fi</button>
            </form>
        </div>

        <!-- TAB 2: TCP CLIENT SETTINGS -->
        <div id="tcp" class="tab-content">
            <h2>Socket Settings</h2>
            <form id="tcp-form">
                <div class="form-group">
                    <div class="row">
                        <div class="label">Server</div>
                        <div class="input-box">
                            <input type="text" id="server_ip" name="server_ip" placeholder="192.168.1.100" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="row">
                        <div class="label">Server Port</div>
                        <div class="input-box">
                            <input type="number" id="server_port" name="server_port" min="1" max="65535" placeholder="8080" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn">💾 Save Settings</button>
            </form>
        </div>

        <!-- TAB 3: SYSTEM INFO (HIỂN THỊ DỮ LIỆU FIREBASE) -->
        <div id="config" class="tab-content">
            <h2>Thông tin hệ thống</h2>
            
            <div class="form-group">
                <div class="row">
                    <div class="label">Chọn thiết bị:</div>
                    <div class="input-box">
                        <select id="device-select">
                            <option value="">-- Đang tải danh sách ESP32 --</option>
                        </select>
                    </div>
                </div>
            </div>

            <hr>

            <div class="info-item">
                <span class="info-label">📡 Trạng thái mạng:</span>
                <span class="info-value status-disconnected" id="network-status">Đang tải...</span>
            </div>

            <div class="info-item">
                <span class="info-label">🌐 IP Address:</span>
                <span class="info-value" id="ip-address">N/A</span>
            </div>

            <div class="info-item">
                <span class="info-label">🔗 MAC Address:</span>
                <span class="info-value" id="mac-address">N/A</span>
            </div>

            <div class="info-item">
                <span class="info-label">📊 SSID:</span>
                <span class="info-value" id="ssid-info">N/A</span>
            </div>

            <hr>

            <button class="btn btn-blue" onclick="loadESP32Devices()">🔄 Làm mới danh sách</button>
        </div>
    </div>

    <!-- 4. LOGIC JAVASCRIPT ĐỌC VÀ HIỂN THỊ DỮ LIỆU -->
    <script>
        let devicesDataCache = {};

        // Hàm chuyển Tab
        function switchTab(event, tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav a').forEach(link => link.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // THUẬT TOÁN ĐỌC DỮ LIỆU TỪ FIREBASE THEO THỜI GIAN THỰC (.on)
        function listenToESP32Devices() {
            const devicesRef = db.ref('esp32/devices');

            devicesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const selectEl = document.getElementById('device-select');

                if (!data) {
                    selectEl.innerHTML = '<option value="">Chưa có ESP32 nào khai báo</option>';
                    resetUIInfo();
                    return;
                }

                devicesDataCache = data;
                const currentSelected = selectEl.value;
                selectEl.innerHTML = '';

                // Thêm các ESP32 vào danh sách thả xuống
                Object.keys(data).forEach((deviceId) => {
                    const dev = data[deviceId];
                    const option = document.createElement('option');
                    option.value = deviceId;
                    option.textContent = `${deviceId} (${dev.ip || 'No IP'})`;
                    selectEl.appendChild(option);
                });

                // Giữ lại thiết bị đang chọn hoặc chọn thiết bị đầu tiên
                if (currentSelected && data[currentSelected]) {
                    selectEl.value = currentSelected;
                    updateUIWithDevice(data[currentSelected]);
                } else {
                    const firstDeviceId = Object.keys(data)[0];
                    selectEl.value = firstDeviceId;
                    updateUIWithDevice(data[firstDeviceId]);
                }
            }, (error) => {
                console.error("Lỗi đọc Firebase:", error);
            });
        }

        // Cập nhật giao diện khi chọn thiết bị
        function updateUIWithDevice(device) {
            if (!device) {
                resetUIInfo();
                return;
            }

            const statusEl = document.getElementById('network-status');
            const isOnline = device.status === 'online';

            statusEl.textContent = isOnline ? '🟢 Online' : '🔴 Offline';
            statusEl.className = 'info-value ' + (isOnline ? 'status-connected' : 'status-disconnected');

            document.getElementById('ip-address').textContent = device.ip || 'N/A';
            document.getElementById('mac-address').textContent = device.mac || 'N/A';
            document.getElementById('ssid-info').textContent = device.ssid || 'N/A';
        }

        function resetUIInfo() {
            document.getElementById('network-status').textContent = 'Chưa kết nối';
            document.getElementById('network-status').className = 'info-value status-disconnected';
            document.getElementById('ip-address').textContent = 'N/A';
            document.getElementById('mac-address').textContent = 'N/A';
            document.getElementById('ssid-info').textContent = 'N/A';
        }

        // Khởi tạo các sự kiện khi DOM sẵn sàng
        document.addEventListener('DOMContentLoaded', function() {
            // Lắng nghe dữ liệu thiết bị từ Firebase
            listenToESP32Devices();

            // Lắng nghe sự kiện người dùng chọn thiết bị khác trên menu drop-down
            document.getElementById('device-select').addEventListener('change', function(e) {
                const selectedId = e.target.value;
                if (devicesDataCache[selectedId]) {
                    updateUIWithDevice(devicesDataCache[selectedId]);
                }
            });

            // Lắng nghe submit TCP Form
            const tcpForm = document.getElementById('tcp-form');
            if (tcpForm) {
                tcpForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const tcpData = {
                        server_ip: document.getElementById('server_ip').value,
                        server_port: parseInt(document.getElementById('server_port').value) || 8080,
                        updated_at: new Date().toISOString()
                    };

                    db.ref('esp32/settings/tcp').set(tcpData)
                        .then(() => alert("✅ Đã lưu cài đặt TCP!"))
                        .catch((error) => alert("❌ Lỗi: " + error.message));
                });
            }
        });
    </script>
</body>
</html>
